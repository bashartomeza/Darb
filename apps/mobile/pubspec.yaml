name: darb_mobile
description: "Darb Arabic-first Android demo shell."
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  file_picker: ^13.3.0
  # Push notifications (dormant unless built with PUSH_ENABLED=true). Held
  # below firebase_core 5 / firebase_messaging 17: those pull Firebase iOS SDK
  # 13, which needs gtm-session-fetcher 4+, while GoogleSignIn-iOS 9 (used by
  # google_sign_in_ios) needs gtm-session-fetcher < 4, so iOS packages would
  # not resolve. Firebase iOS SDK 12.19 accepts 3.4.1..<6.
  firebase_core: ^4.15.2
  firebase_messaging: ^16.7.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_map: ^8.3.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.2
  geolocator: ^14.0.3
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  http: ^1.6.0
  intl: 0.20.2
  latlong2: ^0.10.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.5.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/brand/logo.png
    - assets/images/
    - assets/images/passenger/

  # Bundled rather than fetched at runtime: the app is used in low-bandwidth
  # areas and must render Arabic correctly offline. Licence (OFL) ships
  # alongside the files in assets/fonts/.
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # The passenger screens follow a Figma design set in Inter and Roboto.
    # Both are variable fonts so the design's exact weights (e.g. 546, 568)
    # render via FontVariation; Arabic falls back to IBM Plex Sans Arabic.
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/RobotoVariable.ttf
