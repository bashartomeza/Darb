name: Backend and MySQL CI

on:
  pull_request:
  push:
    branches: [production-readiness]

permissions:
  contents: read

jobs:
  backend-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: darb_mariadb_ci
          MARIADB_USER: darb_ci
          MARIADB_PASSWORD: ci-only-password
          MARIADB_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://darb_ci:ci-only-password@127.0.0.1:3306/darb_mariadb_ci
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Translate migrations and deploy to MariaDB
        run: node scripts/mariadb/migrate-deploy.mjs deploy
      - name: Confirm MariaDB migration deploy is idempotent
        run: node scripts/mariadb/migrate-deploy.mjs deploy
      - name: Confirm MariaDB migration status
        run: node scripts/mariadb/migrate-deploy.mjs status
      - name: Verify every migration was applied
        run: |
          count="$(mysql --protocol=tcp --host=127.0.0.1 --port=3306 --user=darb_ci --password=ci-only-password --batch --skip-column-names darb_mariadb_ci --execute='SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL')"
          expected="$(find apps/api/prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)"
          test "$count" -eq "$expected"
      - run: npm run prisma:generate
      - run: npm run build:api
      - name: Real MariaDB test drivers seed, login and rider matching
        env:
          APP_ENV: demo
          ENABLE_DEMO_FEATURES: "true"
          JWT_SECRET: ci-only-jwt-secret-at-least-thirty-two-characters
          REFRESH_TOKEN_PEPPER: ci-only-refresh-token-pepper-at-least-thirty-two-characters
          DEMO_RESET_KEY: ci-only-reset-key
          DEMO_RESET_ALLOWED_DATABASES: darb_mariadb_ci
          DEMO_PASSENGER_PASSWORD: ci-only-passenger-password
          DEMO_DRIVER_PASSWORD: ci-only-driver-password
          DEMO_MERCHANT_PASSWORD: ci-only-merchant-password
          DEMO_ADMIN_PASSWORD: ci-only-admin-password
          CORS_ORIGINS: http://localhost:5173
          TRUST_PROXY: none
          LOG_LEVEL: silent
          PHONE_DIGEST_PEPPER: ci-only-phone-digest-pepper-at-least-thirty-two-characters
          IDEMPOTENCY_KEY_PEPPER: ci-only-idempotency-pepper-at-least-thirty-two-characters
          ABUSE_KEY_PEPPER: ci-only-abuse-pepper-at-least-thirty-two-characters
        run: npm run test:integration:test-drivers

  backend-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: darb_ci
          MYSQL_USER: darb_ci
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u darb_ci --password=ci-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: demo
      ENABLE_DEMO_FEATURES: "true"
      APP_RELEASE: ci-${{ github.sha }}
      DATABASE_URL: mysql://darb_ci:ci-only-password@127.0.0.1:3306/darb_ci
      JWT_SECRET: ci-only-jwt-secret-at-least-thirty-two-characters
      ACCESS_TOKEN_TTL_SECONDS: "3600"
      REFRESH_TOKEN_TTL_DAYS: "30"
      REFRESH_TOKEN_PEPPER: ci-only-refresh-token-pepper-at-least-thirty-two-characters
      CORS_ORIGINS: http://localhost:5173
      TRUST_PROXY: none
      LOG_LEVEL: silent
      PORT: "3000"
      DEMO_RESET_KEY: ci-only-reset-key
      DEMO_RESET_ALLOWED_DATABASES: darb_ci,darb_canonical_matching_ci,darb_canonical_shared_ci
      DEMO_PASSENGER_PASSWORD: ci-only-passenger-password
      DEMO_DRIVER_PASSWORD: ci-only-driver-password
      DEMO_MERCHANT_PASSWORD: ci-only-merchant-password
      DEMO_ADMIN_PASSWORD: ci-only-admin-password
      API_BASE_URL: http://127.0.0.1:3000
      INVITATIONS_ENABLED: "true"
      PUBLIC_ONBOARDING_ENABLED: "false"
      OTP_PROVIDER: fake
      SUPPORTED_PHONE_REGIONS: PS
      INVITATION_CODE_PEPPER: ci-only-invitation-code-pepper-at-least-thirty-two-characters
      PHONE_DIGEST_PEPPER: ci-only-phone-digest-pepper-at-least-thirty-two-characters
      OTP_CODE_PEPPER: ci-only-otp-code-pepper-at-least-thirty-two-characters
      ONBOARDING_SESSION_PEPPER: ci-only-onboarding-session-pepper-at-least-thirty-two-characters
      IDEMPOTENCY_KEY_PEPPER: ci-only-idempotency-pepper-at-least-thirty-two-characters
      ABUSE_KEY_PEPPER: ci-only-abuse-pepper-at-least-thirty-two-characters
      VITE_APP_ENV: production
      VITE_ENABLE_DEMO_FEATURES: "false"
      VITE_API_BASE_URL: https://api.staging.darb.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - name: Allow reviewed integrity-trigger creation
        env:
          MYSQL_PWD: ci-only-root-password
        run: |
          mysql --protocol=tcp --host=127.0.0.1 --port=3306 --user=root \
            --execute="SET GLOBAL log_bin_trust_function_creators = 1; GRANT SELECT ON performance_schema.data_lock_waits TO 'darb_ci'@'%';"
      - name: Deploy migrations from empty database
        run: npm run db:migrate
      - name: Confirm migration deploy is idempotent
        run: npm run db:migrate
      - run: npm run db:migrate:status
      - name: Verify disposable migration upgrade from the prior history to current
        env:
          MYSQL_PWD: ci-only-root-password
          DATABASE_URL: mysql://darb_ci:ci-only-password@127.0.0.1:3306/darb_upgrade_ci
        run: |
          mysql --protocol=tcp --host=127.0.0.1 --port=3306 --user=root \
            --execute="CREATE DATABASE darb_upgrade_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON darb_upgrade_ci.* TO 'darb_ci'@'%';"
          mkdir -p .staging-data/migration-upgrade/prisma/migrations
          cp apps/api/prisma.config.ts .staging-data/migration-upgrade/
          cp apps/api/prisma/schema.prisma .staging-data/migration-upgrade/prisma/
          cp apps/api/prisma/migrations/migration_lock.toml .staging-data/migration-upgrade/prisma/migrations/
          mapfile -t migrations < <(find apps/api/prisma/migrations -mindepth 1 -maxdepth 1 -type d | sort)
          migration_count="${#migrations[@]}"
          test "$migration_count" -ge 1
          prior_count=$((migration_count - 1))
          for migration in "${migrations[@]:0:$prior_count}"; do cp -R "$migration" .staging-data/migration-upgrade/prisma/migrations/; done
          node node_modules/prisma/build/index.js migrate deploy --config .staging-data/migration-upgrade/prisma.config.ts
          test "$(mysql --protocol=tcp --host=127.0.0.1 --port=3306 --user=root --batch --skip-column-names darb_upgrade_ci --execute='SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL')" -eq "$prior_count"
          cp -R "${migrations[$prior_count]}" .staging-data/migration-upgrade/prisma/migrations/
          node node_modules/prisma/build/index.js migrate deploy --config .staging-data/migration-upgrade/prisma.config.ts
          node node_modules/prisma/build/index.js migrate deploy --config .staging-data/migration-upgrade/prisma.config.ts
          test "$(mysql --protocol=tcp --host=127.0.0.1 --port=3306 --user=root --batch --skip-column-names darb_upgrade_ci --execute='SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL')" -eq "$migration_count"
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Real MySQL limited provider directory and shared budget (synthetic transport only)
        run: node apps/api/dist/scripts/limitedCheckpointDirectoryIntegration.js
      - name: Real MySQL synthetic checkpoint directory authorization
        run: node apps/api/dist/scripts/checkpointDirectoryIntegration.js
      - name: Real MySQL merchant order atomicity and recovery
        env:
          MERCHANT_ORDER_INTEGRATION_CONFIRM_DISPOSABLE: "true"
        run: npm run test:integration:merchant-orders
      - name: Real MySQL merchant manual matching and synchronization contracts
        env:
          MERCHANT_ORDER_INTEGRATION_CONFIRM_DISPOSABLE: "true"
        run: npm run test:integration:merchant-matching
      - name: Real MySQL legacy cargo batching integrity and recovery
        env:
          MERCHANT_ORDER_INTEGRATION_CONFIRM_DISPOSABLE: "true"
          MULTI_ROUTE_ENTRY_ENABLED: "false"
          MULTI_ROUTE_MATCHING_ENABLED: "false"
          CANONICAL_TRIP_CREATION_ENABLED: "false"
          CANONICAL_SHARED_TRIPS_ENABLED: "false"
        run: npm run test:integration:cargo
      - name: Real MySQL passenger driver lifecycle synchronization and concurrency
        env:
          MERCHANT_ORDER_INTEGRATION_CONFIRM_DISPOSABLE: "true"
        run: npm run test:integration:passenger-trip-sync
      - name: Real MySQL capacity contention, cancellation and response loss
        env:
          MERCHANT_ORDER_INTEGRATION_CONFIRM_DISPOSABLE: "true"
        run: npm run test:integration:capacity
      - name: Real MySQL deterministic and trusted-session integration smoke
        run: npm run test:integration:mysql
      - name: Real MySQL persistent demo-reset gate matrix
        run: npm run test:integration:reset-matrix
      - name: Real MySQL legacy online-state response-loss recovery
        run: npm run test:integration:legacy-online
      - name: Real MySQL passenger request and Trip association
        run: npm run test:integration:passenger-trip-association
      - name: Real MySQL test drivers seed, login and rider matching
        run: npm run test:integration:test-drivers
      - name: Real MySQL canonical single-demand integration
        env:
          MYSQL_PWD: ci-only-root-password
          DATABASE_URL: mysql://darb_ci:ci-only-password@127.0.0.1:3306/darb_canonical_matching_ci
          APP_ENV: test
          MULTI_ROUTE_ENTRY_ENABLED: "true"
          MULTI_ROUTE_MATCHING_ENABLED: "true"
          CANONICAL_TRIP_CREATION_ENABLED: "true"
        run: |
          mysql --protocol=tcp --host=127.0.0.1 --port=3306 --user=root \
            --execute="CREATE DATABASE darb_canonical_matching_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON darb_canonical_matching_ci.* TO 'darb_ci'@'%';"
          npm run db:migrate
          npm run test:integration:canonical-matching
      - name: Real MySQL canonical shared-trip integration
        env:
          MYSQL_PWD: ci-only-root-password
          DATABASE_URL: mysql://darb_ci:ci-only-password@127.0.0.1:3306/darb_canonical_shared_ci
          APP_ENV: demo
          ENABLE_DEMO_FEATURES: "true"
          MULTI_ROUTE_ENTRY_ENABLED: "true"
          MULTI_ROUTE_MATCHING_ENABLED: "true"
          CANONICAL_TRIP_CREATION_ENABLED: "true"
          CANONICAL_SHARED_TRIPS_ENABLED: "true"
        run: |
          mysql --protocol=tcp --host=127.0.0.1 --port=3306 --user=root \
            --execute="CREATE DATABASE darb_canonical_shared_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON darb_canonical_shared_ci.* TO 'darb_ci'@'%';"
          npm run db:migrate
          npm run test:integration:canonical-shared
      - name: Real MySQL canonical capacity expiry and exact replay
        env:
          DATABASE_URL: mysql://darb_ci:ci-only-password@127.0.0.1:3306/darb_canonical_shared_ci
          APP_ENV: demo
          ENABLE_DEMO_FEATURES: "true"
          MULTI_ROUTE_ENTRY_ENABLED: "true"
          MULTI_ROUTE_MATCHING_ENABLED: "true"
          CANONICAL_TRIP_CREATION_ENABLED: "true"
          CANONICAL_SHARED_TRIPS_ENABLED: "true"
          MERCHANT_ORDER_INTEGRATION_CONFIRM_DISPOSABLE: "true"
        run: npm run test:integration:canonical-capacity

  # The Python AI service the API calls for voice and parsing. Its tests include the
  # contract-drift check on contracts/ui_directives.v1.json, which the API and the apps read.
  ai-services-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install pinned dependencies and pytest
        run: |
          python3 -m venv .venv-ai-services
          .venv-ai-services/bin/python -m pip install --quiet -r apps/api/ai_services/requirements-dev.txt
      - name: AI service tests and contract drift
        run: .venv-ai-services/bin/python -m pytest apps/api/ai_services/tests -q -p no:cacheprovider
      - name: AI service image builds (only the service code is sent as build context)
        working-directory: apps/api
        run: docker build -q -t darb-ai-services:ci -f ai_services/Dockerfile .
